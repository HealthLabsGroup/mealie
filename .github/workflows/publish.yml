name: Publish HealthLabs Container

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: true
        type: string
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          build-contexts: |
            packages=dist
          build-args: |
            COMMIT=${{ inputs.ref }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/healthlabsgroup/mealie:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/HealthLabsGroup/mealie
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ inputs.tag }}
