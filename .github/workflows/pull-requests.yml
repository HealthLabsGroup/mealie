name: PR CI

on:
  pull_request:
    branches:
      - mealie-next
  merge_group:
    types: [checks_requested]
    branches:
      - mealie-next

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  pull-request-lint:
    name: "Lint PR"
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pull-request-lint.yml
    permissions:
      pull-requests: write

  backend-tests:
    name: "Backend Server Tests"
    uses: ./.github/workflows/test-backend.yml

  frontend-tests:
    name: "Frontend Tests"
    uses: ./.github/workflows/test-frontend.yml

  container-scanning:
    name: "Trivy Container Scanning"
    if: github.event_name == 'pull_request'
    needs: build-package
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/partial-trivy-container-scanning.yml

  code-ql:
    name: "CodeQL"
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build-package:
    name: "Build Python package"
    uses: ./.github/workflows/build-package.yml
    with:
      tag: e2e

  end-to-end:
    name: "End-to-End Tests"
    needs: build-package
    uses: ./.github/workflows/e2e.yml

  healthlabs-policy:
    name: "HealthLabs Policy and Secret Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify fork governance
        run: ./scripts/healthlabs/verify-governance.sh
      - name: Verify release policy
        run: ./scripts/healthlabs/verify-release-policy.sh
      - name: Test release scripts
        run: ./scripts/healthlabs/test-release-scripts.sh
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
