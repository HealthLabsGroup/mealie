name: HealthLabs Release

on:
  push:
    tags:
      - "v*-healthlabs.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      upstream-version: ${{ steps.tag.outputs.upstream-version }}
      package-version: ${{ steps.tag.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: tag
        name: Validate release tag
        run: ./scripts/healthlabs/validate-release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Require release commit on mealie-next
        run: |
          git fetch origin mealie-next
          branch_head=$(git rev-parse origin/mealie-next)
          test "$GITHUB_SHA" = "$branch_head"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"
      - name: Require immutable release namespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          protected=$(gh api "repos/$GITHUB_REPOSITORY/rulesets" \
            --jq 'any(.[]; .name == "Protect HealthLabs release tags" and .enforcement == "active")')
          test "$protected" = true
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Require matching upstream application version
        run: |
          actual=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$actual" = "${{ steps.tag.outputs.upstream-version }}"

  backend-tests:
    needs: validate
    uses: ./.github/workflows/test-backend.yml
    with:
      ref: ${{ github.sha }}

  frontend-tests:
    needs: validate
    uses: ./.github/workflows/test-frontend.yml
    with:
      ref: ${{ github.sha }}

  build-package:
    needs: validate
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ needs.validate.outputs.package-version }}
      ref: ${{ github.sha }}

  end-to-end:
    needs: build-package
    uses: ./.github/workflows/e2e.yml

  codeql:
    needs: validate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  secret-and-policy-scan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: ./scripts/healthlabs/verify-governance.sh
      - run: ./scripts/healthlabs/verify-release-policy.sh
      - run: ./scripts/healthlabs/test-release-scripts.sh
      - name: Validate all GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive=/tmp/actionlint.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C /tmp actionlint
          /tmp/actionlint -shellcheck=
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          HEALTHLABS_FORK_BASE_SHA: ce0be528e7cfce4bf1fa846c3c136186dd719af5
        run: |
          archive=/tmp/gitleaks.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose \
            --log-opts="${HEALTHLABS_FORK_BASE_SHA}..HEAD" .

  publish:
    needs:
      - backend-tests
      - frontend-tests
      - build-package
      - end-to-end
      - codeql
      - secret-and-policy-scan
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ github.sha }}

  github-release:
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source-linked release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          UPSTREAM_VERSION: ${{ needs.validate.outputs.upstream-version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Image: ghcr.io/healthlabsgroup/mealie@$IMAGE_DIGEST

          Upstream version: $UPSTREAM_VERSION
          Source commit: https://github.com/HealthLabsGroup/mealie/tree/$GITHUB_SHA
          Rollback: redeploy the previously recorded immutable digest. This baseline release contains no HealthLabs schema migration."
